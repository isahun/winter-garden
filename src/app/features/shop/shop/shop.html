<section class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-semibold mb-6">Catàleg</h1>

  <search class="flex gap-4 mb-6">
    <label for="search-input" class="sr-only">Cercar productes</label>
    <input id="search-input" type="search" placeholder="Cercar productes..."
      (input)="search.set($any($event.target).value)" class="input flex-1" />
    <label for="category-select" class="sr-only">Filtrar per categoria</label>
    <select id="category-select" (change)="selectedCategory.set($any($event.target).value)" class="input">
      <option value="">Totes les categories</option>
      <option value="jardins-fets">Jardins</option>
      <option value="elements-solts">Elements</option>
      <option value="terraris">Terraris de vidre</option>
    </select>
  </search>

  <ul class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 list-none">
    @for (product of filteredProducts(); track product.id) {
    <li class="relative">
      <a [routerLink]="['/shop', product.id]" class="card hover:shadow-md transition block">
        <button (click)="favorites.toggleFavorite(product); $event.preventDefault()"
          class="absolute top-2 right-2 text-xl" [attr.aria-label]="'Favorit'">
          {{ favorites.isFavorite(product.id)() ? '❤️' : '🤍' }}
        </button>
        <img [src]="product.images[0] || 'assets/placeholder.jpg'" [alt]="product.name"
          class="w-full aspect-square object-cover rounded" />
        <div class="p-3">
          <h3 class="font-medium">{{ product.name }}</h3>
          <p class="text-green-700 font-semibold">{{ product.price | currency:'EUR' }}</p>
        </div>
      </a>
    </li>
    } @empty {
    <li class="col-span-full text-center text-gray-500">Cap producte trobat.</li>
    }
  </ul>
</section>
