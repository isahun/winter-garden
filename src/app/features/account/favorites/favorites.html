<section class="container mx-auto px-4 py-8 max-w-2xl">
  <a routerLink="/account" class="text-sm text-gray-500 hover:underline mb-4 inline-block">← Tornar al meu compte</a>
  <div class="h-32 overflow-hidden rounded-xl mb-6">
    <img src="https://res.cloudinary.com/dou285kwq/image/upload/w_800,h_250,c_fill,f_auto,q_auto/v1779459369/pexels-katarzyna-modrzejewska-495044-1400375_ylyblu.jpg"
      alt="" aria-hidden="true" class="w-full h-full object-cover object-[30%_100%]" />
  </div>
  <h1 class="text-3xl font-semibold mb-6">Els meus favorits</h1>

  @if (products().length === 0) {
  <p class="text-gray-500 mb-4">No tens cap producte guardat com a favorit.</p>
  <a routerLink="/shop" class="btn-primary">Veure el catàleg</a>
  } @else {
  <ul class="grid grid-cols-2 md:grid-cols-3 gap-6 list-none">
    @for (product of products(); track product.id) {
    <li class="card relative">
      <a [routerLink]="['/shop', product.id]" class="block">
        <img [src]="product.images[0] || 'assets/placeholder.jpg'" [alt]="product.name"
          class="w-full aspect-square object-cover rounded-t" />
        <div class="p-3">
          <h2 class="font-medium text-sm">{{ product.name }}</h2>
          <p class="text-green-700 font-semibold">{{ product.price | currency:'EUR' }}</p>
        </div>
      </a>
      <button (click)="removeFavorite(product)" class="absolute top-2 right-2 text-xl" aria-label="Eliminar dels favorits">
        ❤️
      </button>
    </li>
    }
  </ul>
  }
</section>
