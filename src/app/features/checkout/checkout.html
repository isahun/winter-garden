<div class="container mx-auto px-4 py-8 max-w-md">
  <h1 class="text-2xl font-semibold mb-6">Finalitzar compra</h1>

  <div class="card p-6 mb-6">
    <p class="text-lg">Total: <strong>{{ total() | currency:'EUR' }}</strong></p>
  </div>

  <div id="payment-element" class="mb-6 min-h-[100px]">
    @if (!ready()) {
    <p class="text-gray-400 text-sm animate-pulse">Carregant formulari...</p>
    }
  </div>

  @if (error()) {
  <p class="text-red-600 mb-4 text-sm" role="alert" aria-live="polite">{{ error() }}</p>
  }

  <button (click)="pay()" [disabled]="!ready() || paying()" class="btn-primary w-full">
    {{ paying() ? 'Processant...' : 'Pagar ara' }}
  </button>
</div>
