<div class="min-h-screen flex items-center justify-center">
  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-sm space-y-4">
    <h1 class="text-2xl font-semibold">Iniciar sessió</h1>

    @if (error()) {
      <p class="text-red-600 text-sm">{{ error() }}</p>
    }

    <input formControlName="email" type="email" placeholder="Email" class="input w-full" />
    <input formControlName="password" type="password" placeholder="Contrasenya" class="input w-full" />

    <button type="submit" [disabled]="loading()" class="btn-primary w-full">
      {{ loading() ? 'Carregant...' : 'Entrar' }}
    </button>

    <p class="text-sm text-center">
      No tens compte? <a routerLink="/auth/register" class="underline">Registra't</a>
    </p>
  </form>
</div>
