@if (dialog.config(); as cfg) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" (click)="dialog.close(false)"></div>
    <div class="relative z-10 bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full">
      <p class="text-sm leading-relaxed mb-8">{{ cfg.message }}</p>
      <div class="flex justify-end gap-3">
        @if (cfg.cancelLabel) {
          <button class="btn-secondary px-4 py-2 text-xs" (click)="dialog.close(false)">
            {{ cfg.cancelLabel }}
          </button>
        }
        <button
          [class]="cfg.danger ? 'btn-danger px-4 py-2 text-xs' : 'btn-primary px-4 py-2 text-xs'"
          (click)="dialog.close(true)">
          {{ cfg.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
